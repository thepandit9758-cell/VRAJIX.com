name = "vrajix"
compatibility_date = "2024-05-01"
pages_build_output_dir = "frontend"

[vars]
ENVIRONMENT = "production"

# Cloudflare D1 Persistent Database Binding
[[d1_databases]]
binding = "DB"
database_name = "vrajix-db"
database_id = "vrajix-d1-production-id"

# Note: Set your production secrets securely in Cloudflare:
# wrangler secret put WEB3FORMS_ACCESS_KEY
